<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin:0; background:#f5f0e6; }
  .card {
    width:680px; padding:44px 48px 36px;
    font-family:'SF Mono','Menlo','Consolas',monospace;
    background:#f5f0e6; color:#00247d; box-sizing:border-box;
  }
  .opener { font-size:26px; font-weight:700; margin-bottom:26px; }
  .line { display:flex; align-items:baseline; gap:14px; font-size:22px; margin-bottom:14px; }
  .emoji { width:28px; flex-shrink:0; }
  .label { flex:1; }
  .value { font-weight:700; white-space:nowrap; }
  .rule { border:none; border-top:1.5px solid #00247d33; margin:24px 0 14px; }
  .footnote { font-size:15px; color:#00247d99; }
  .dateline { font-size:15px; color:#00247d99; margin-bottom:6px; }
</style></head>
<body>
  <div class="card">
    <div class="dateline">June 2026</div>
    <div class="opener">👮 Crimes recorded within a mile of each town hall</div>
    <div class="line"><span class="emoji">📍</span><span class="label">Camden — the most of 8 boroughs checked</span><span class="value">2,973</span></div>
    <div class="line"><span class="emoji">📍</span><span class="label">Bromley — the fewest</span><span class="value">410</span></div>
    <div class="line"><span class="emoji">🎯</span><span class="label">Central London's top category: other theft</span><span class="value">968</span></div>
    <hr class="rule">
    <div class="footnote">Source: data.police.uk, 1-mile radius searches · #LondonIndex</div>
  </div>
</body></html>
